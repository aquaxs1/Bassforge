name: Build BassForge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Installer + portable EXE bauen
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: BassForge-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Android-SDK-Lizenzen akzeptieren (SDK ist auf dem Runner vorinstalliert)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build:web
      - name: Android-Projekt erzeugen
        run: npx cap add android
      - name: App-Icons und Splash erzeugen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Speicher-Berechtigung für ältere Android-Versionen
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />#' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' android/app/src/main/AndroidManifest.xml
          grep -n "permission\|requestLegacy" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BassForge-Android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: BassForge-Android
          path: BassForge-Android.apk
          if-no-files-found: error

  ios:
    name: iOS (.ipa, unsigniert)
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: iOS-Projekt erzeugen
        run: npx cap add ios --packagemanager SPM
      - name: App-Icons und Splash erzeugen
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'
      - name: Exporte in der Dateien-App sichtbar machen
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName BassForge" "$PLIST" || true
      - run: npx cap sync ios
      - name: App bauen (ohne Signatur)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA packen
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/BassForge.app
          zip -qry BassForge-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: BassForge-iOS
          path: BassForge-iOS-unsigned.ipa
          if-no-files-found: error

  release:
    name: Download-Seite (Release)
    needs: [windows, android, ios]
    if: ${{ !cancelled() && (needs.windows.result == 'success' || needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BassForge Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Automatischer Build von `${{ github.sha }}`.

            - **Windows:** `BassForge-Setup-*.exe` installieren oder `BassForge-Portable-*.exe` direkt starten.
            - **Android:** `BassForge-Android.apk` aufs Handy laden und installieren („Installation aus unbekannten Quellen“ erlauben).
            - **iOS:** `BassForge-iOS-unsigned.ipa` ist unsigniert – mit AltStore oder Sideloadly und deiner Apple-ID installieren.
          files: out/*
          fail_on_unmatched_files: false
